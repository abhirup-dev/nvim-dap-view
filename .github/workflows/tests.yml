name: Tests

on:
  push:
    branches: [main, patches, abhirup/stabilize-debugger]
    paths: ["lua/**", "plugin/**", "tests/**", "examples/**", "nvim-dap-mcp/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["lua/**", "plugin/**", "tests/**", "examples/**", "nvim-dap-mcp/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debugger-and-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set isolated test paths
        run: |
          echo "NVIM_DAP_PATH=$RUNNER_TEMP/nvim-dap" >> "$GITHUB_ENV"
          echo "NVIM_NIO_PATH=$RUNNER_TEMP/nvim-nio" >> "$GITHUB_ENV"
          echo "DLV=$RUNNER_TEMP/dap-bin/dlv" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: nvim-dap-mcp/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: |
          curl --fail --location --silent --show-error https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          git clone --filter=blob:none https://github.com/mfussenegger/nvim-dap "$NVIM_DAP_PATH"
          git -C "$NVIM_DAP_PATH" checkout cfa2d58f4537aca6ca83e2de1a0d9f1491121264
          git clone --filter=blob:none https://github.com/nvim-neotest/nvim-nio "$NVIM_NIO_PATH"
          git -C "$NVIM_NIO_PATH" checkout edcc181a875301dd21840189aa2f2f9ad69fc172
          python3 -m pip install --disable-pip-version-check protobuf==7.35.1
          GOBIN="$RUNNER_TEMP/dap-bin" go install github.com/go-delve/delve/cmd/dlv@v1.27.2
      - name: Verify prerequisites and assertion failure propagation
        run: |
          nvim --version
          test -f "$NVIM_DAP_PATH/lua/dap.lua"
          test -x "$DLV"
          if nvim --headless -u NONE -c 'lua local H = dofile("tests/harness.lua"); H.ok(false, "expected failure-propagation probe"); H.done()'; then
            echo "A failed assertion incorrectly exited successfully"
            exit 1
          fi
      - name: UI regressions across tab and split hosts
        run: nvim --headless -u NONE -l tests/run.lua
      - name: MCP Lua and real sidecar lifecycle regressions
        run: make -C nvim-dap-mcp test-lua
      - name: MCP Go integration and race checks
        working-directory: nvim-dap-mcp
        run: |
          go test -race -count=1 -json ./... | tee "$RUNNER_TEMP/dap-go-tests.jsonl"
          python3 - "$RUNNER_TEMP/dap-go-tests.jsonl" <<'PYTHON'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          skipped = [event.get("Test", event["Package"]) for event in events if event.get("Action") == "skip" and event.get("Test")]
          assert not skipped, f"Required integration tests were skipped: {skipped}"
          assert any(event.get("Test") and event.get("Action") == "pass" for event in events), "No Go tests ran"
          PYTHON
          go vet ./...
      - name: Serialized protobuf fixture
        run: |
          python3 examples/decoders/make_fixture.py
          go build -gcflags='all=-N -l' -o examples/decoders/fixture examples/decoders/main.go
      - name: Real Delve decoder integration in both hosts
        run: |
          HOST=split nvim --headless -u NONE -l tests/integration/decoder_delve.lua
          HOST=tab nvim --headless -u NONE -l tests/integration/decoder_delve.lua
          python3 tests/integration/decoder_rpc.py
